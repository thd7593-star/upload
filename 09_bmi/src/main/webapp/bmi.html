<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>짱구 스타일 BMI 검사</title>
<style>
body {
    font-family: Arial, sans-serif; /* 일반 고딕 계열 */
    background-color: #fff8dc; /* 밝은 만화풍 배경 */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    position: relative;
}

/* 귀여운 구름/말풍선 배경 */
body::before {
    content: "💭";
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 60px;
    opacity: 0.2;
}

form {
    background-color: #ffffe0; /* 연한 노랑 */
    padding: 40px;
    border-radius: 25px;
    box-shadow: 5px 5px 0px #ff69b4; /* 만화 그림자 */
    width: 350px;
    position: relative;
    border: 3px dashed #ff1493; /* 귀여운 테두리 */
}

h1 {
    text-align: center;
    color: #ff4500; /* 강렬한 오렌지 */
    margin-bottom: 25px;
    font-size: 36px;
    text-shadow: 2px 2px #ffd700;
}

table {
    border-collapse: collapse;
    width: 100%;
}

td {
    padding: 10px;
    text-align: left;
    font-size: 16px;
}

input[type="text"], input[type="file"] {
    width: 100%;
    padding: 8px;
    border: 2px solid #ff99cc;
    border-radius: 10px;
    font-family: Arial, sans-serif; /* 고딕 계열 */
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background-color: #ff69b4;
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 3px 3px 0px #ff1493;
    transition: transform 0.1s;
}

button:hover {
    transform: scale(1.05);
    background-color: #ff4d94;
}
</style>
</head>
<body>
    <form action="bmi.jsp" method="post" enctype="multipart/form-data">
        <h1>❤️BMI 검사 ❤️</h1>
        <table>
            <tr>
                <td>이름:</td>
                <td><input type="text" name="name" placeholder="필수, 2글자이상"></td>
            </tr>
            <tr>
                <td>키(cm):</td>
                <td><input type="text" name="height" placeholder="3자리이상/ 숫자만"></td>
            </tr>
            <tr>
                <td>체중(kg):</td>
                <td><input type="text" name="weight" placeholder="숫자만"></td>
            </tr>
            <tr>
                <td>사진 첨부:</td>
                <td><input type="file" name="imgFile" ></td>
            </tr>
        </table>
        <button type="submit">계산</button>
    </form>
</body>
</html>
